<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kanitsu · 新版 UI 样式 Demo</title>
<style>
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1115;
  --bg-elevated: #171a20;
  --surface: #1c2128;
  --surface-2: #232a33;
  --border: #2a313b;
  --border-strong: #38404c;
  --text: #f2f4f7;
  --text-muted: #98a2b0;
  --text-faint: #6b7480;
  --accent: #4f8cff;
  --accent-hover: #6ba1ff;
  --accent-fg: #ffffff;
  --danger: #ef5350;
  --success: #45c586;
  --shadow: 0 6px 24px rgba(0,0,0,.4);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.25);
  --skeleton: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.1), rgba(255,255,255,.04));
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f5f7;
  --bg-elevated: #ffffff;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --border: #e3e7ed;
  --border-strong: #cfd6df;
  --text: #1d1f24;
  --text-muted: #5c6673;
  --text-faint: #9aa3ae;
  --accent: #2563eb;
  --accent-hover: #3b76f6;
  --accent-fg: #ffffff;
  --danger: #e5484d;
  --success: #2f9e6c;
  --shadow: 0 6px 24px rgba(31,41,55,.12);
  --shadow-sm: 0 2px 8px rgba(31,41,55,.08);
  --skeleton: linear-gradient(90deg, rgba(0,0,0,.04), rgba(0,0,0,.09), rgba(0,0,0,.04));
}

:root { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-size: 14px; }
button { font: inherit; cursor: pointer; }

/* Layout */
.app-shell { display: flex; height: 100vh; }
.sidebar { width: 260px; min-width: 260px; background: var(--bg-elevated); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: width .2s ease, min-width .2s ease; }
.app-shell.sidebar-collapsed .sidebar { width: 0; min-width: 0; overflow: hidden; }
.sidebar-inner { padding: 14px; display: flex; flex-direction: column; gap: 14px; flex: 1; min-width: 232px; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* Brand */
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
.brand .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), #8b5cf6); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; box-shadow: var(--shadow-sm); }
.brand .name { font-size: 16px; font-weight: 700; letter-spacing: .5px; }

/* Tree */
.tree-title { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .8px; margin: 4px 6px 2px; }
.tree { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.tree li { display: block; }
.tree-row { display: flex; align-items: center; border-radius: 8px; gap: 4px; padding: 6px 6px; color: var(--text-muted); transition: background .12s ease, color .12s ease; }
.tree-row:hover { background: var(--surface-2); color: var(--text); }
.tree-row.active { background: var(--accent); color: var(--accent-fg); }
.tree-row .chev { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-faint); }
.tree-row.active .chev { color: rgba(255,255,255,.85); }
.tree-row .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.tree-row .count { color: var(--text-faint); font-size: 11px; }
.tree-row.active .count { color: rgba(255,255,255,.8); }
.tree .nested { padding-left: 18px; }

/* Sidebar footer */
.sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
.sidebar-footer .mode { font-size: 11px; color: var(--text-faint); }

/* Buttons */
.btn { background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 7px 11px; color: var(--text); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; transition: background .12s ease, border-color .12s ease, transform .06s ease; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--danger); border-color: rgba(239,83,80,.25); }
.btn.danger:hover { background: rgba(239,83,80,.1); }
.btn.icon { padding: 7px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Header */
.header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--bg-elevated); }
.header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.slide-toggle { display: inline-flex; }
.crumb { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }
.crumb a { color: var(--accent); text-decoration: none; }
.crumb a:hover { text-decoration: underline; }
.crumb .sep { color: var(--text-faint); }
.header-title-row { display: flex; align-items: baseline; gap: 12px; margin-top: 4px; }
.header h2 { margin: 0; font-size: 20px; font-weight: 700; }
.header .meta { color: var(--text-muted); font-size: 13px; }
.header-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.header-actions .divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

/* Content */
.content { flex: 1; overflow-y: auto; padding: 20px; }
.section-title { font-size: 13px; color: var(--text-muted); margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
.grid + .grid, .section + .folder-grid { margin-top: 28px; }

.card { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease; }
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--accent); }
.card .cover { aspect-ratio: 4/3; background: var(--surface-2); position: relative; overflow: hidden; }
.card .cover.placeholder { display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 12px; }
.card figcaption { padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card figcaption .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card figcaption .count { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
.card .cover .zoom-hint { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.55); color: #fff; border-radius: 6px; padding: 2px 6px; font-size: 11px; opacity: 0; transition: opacity .12s ease; }
.card:hover .cover .zoom-hint { opacity: 1; }
.folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
.section { margin-bottom: 28px; }

/* Skeleton */
.skeleton { position: relative; overflow: hidden; background: var(--surface-2); }
.skeleton:after { content: ""; position: absolute; inset: 0; background: var(--skeleton); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

/* Empty state */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 60px 20px; text-align: center; color: var(--text-muted); border: 1px dashed var(--border); border-radius: 16px; background: var(--surface); }
.empty .icon { font-size: 40px; }
.empty .hint { font-size: 14px; }

/* Viewer overlay */
.lightbox { position: fixed; inset: 0; z-index: 40; background: #000; display: none; flex-direction: column; }
.lightbox.open { display: flex; }
.lightbox-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; color: #fff; }
.lightbox-top .nav { display: flex; align-items: center; gap: 10px; }
.lightbox-top .counter { font-size: 13px; color: rgba(255,255,255,.75); }
.lightbox canvas.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.lightbox .img-wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.lightbox .stage-placeholder { color: rgba(255,255,255,.5); font-size: 13px; }
.lightbox-top button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 7px 10px; }
.lightbox-top button:hover { background: rgba(255,255,255,.22); }
.lightbox .filmstrip { display: flex; gap: 8px; overflow-x: auto; padding: 12px 18px; background: rgba(0,0,0,.4); }
.lightbox .filmstrip .thumb { width: 72px; height: 54px; border-radius: 8px; background: #222; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.6); font-size: 11px; }
.lightbox .filmstrip .thumb:hover { border-color: rgba(255,255,255,.4); }
.lightbox .filmstrip .thumb.active { border-color: var(--accent); }
.lightbox .info { position: absolute; right: 18px; bottom: 74px; background: rgba(0,0,0,.5); color: rgba(255,255,255,.85); border-radius: 8px; padding: 6px 10px; font-size: 12px; }

/* Toast */
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: flex; flex-direction: column; gap: 8px; }
.toast .item { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--success); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); min-width: 240px; display: flex; align-items: center; gap: 8px; font-size: 13px; animation: pop .2s ease; }
.toast .item.error { border-left-color: var(--danger); }
.toast .item.info { border-left-color: var(--accent); }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Modal */
.modal-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: 80vh; overflow: auto; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.modal-header h3 { margin: 0; font-size: 16px; }
.modal-body { padding: 16px 18px; font-size: 13px; color: var(--text-muted); line-height: 1.6; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--border); }

.muted { color: var(--text-muted); }
.demo-note { position: fixed; left: 16px; bottom: 16px; z-index: 70; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 12px; color: var(--text-muted); box-shadow: var(--shadow-sm); }
</style>
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="sidebar">
    <div class="sidebar-inner">
      <div class="brand">
        <div class="logo">◉</div>
        <div class="name">Kanitsu</div>
      </div>
      <div>
        <div class="tree-title">收藏</div>
        <ul class="tree">
          <li><div class="tree-row active"><span class="chev">▾</span><span class="name">我的相册</span><span class="count">12 相册</span></div></li>
          <li><div class="tree-row"><span class="chev">▸</span><span class="name">最近导入</span><span class="count">3</span></div></li>
          <li><div class="tree-row"><span class="chev">▸</span><span class="name">收藏</span><span class="count">27</span></div></li>
        </ul>
      </div>
      <div>
        <div class="tree-title">目录树</div>
        <ul class="tree">
          <li><div class="tree-row"><span class="chev">▾</span><span class="name">旅行</span><span class="count">3 子</span></div></li>
          <li><ul class="nested"><li><div class="tree-row"><span class="name">东京 2024</span><span class="count">58</span></div></li></ul></li>
          <li><div class="tree-row"><span class="chev">▸</span><span class="name">家人</span><span class="count">2 子</span></div></li>
          <li><div class="tree-row"><span class="chev">▸</span><span class="name">作品集</span><span class="count">4 子</span></div></li>
        </ul>
      </div>
      <div class="sidebar-footer">
        <button class="btn" onclick="app.showToast('导入完成：36 张图片', 'success')">导入报告</button>
        <div class="mode">Web demo v0.5</div>
      </div>
    </div>
  </aside>
  <main class="main">
    <div class="header">
      <div class="header-left">
        <button class="btn icon slide-toggle" id="slideToggle" aria-label="收起侧边栏">≡</button>
        <div>
          <div class="crumb"><a href="#">我的相册</a><span class="sep">›</span><a href="#">旅行</a><span class="sep">›</span><span>东京 2024</span></div>
          <div class="header-title-row"><h2>东京 2024</h2><span class="meta">58 图片 / 0 子目录</span></div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn primary">＋ 导入相册</button>
        <button class="btn">刷新</button>
        <button class="btn">整理</button>
        <button class="btn">导出 ZIP</button>
        <button class="btn danger">删除</button>
        <span class="divider"></span>
        <button class="btn icon" id="themeToggle" aria-label="切换主题">☾</button>
      </div>
    </div>
    <div class="content">
      <section class="section">
        <h3 class="section-title">子文件夹</h3>
        <div class="folder-grid">
          <figure class="card"><div class="cover placeholder">封面</div><figcaption><span class="name">第一天</span><span class="count">12 img</span></figcaption></figure>
          <figure class="card"><div class="cover placeholder">封面</div><figcaption><span class="name">第二天</span><span class="count">18 img</span></figcaption></figure>
          <figure class="card"><div class="cover placeholder">封面</div><figcaption><span class="name">夜景</span><span class="count">8 img</span></figcaption></figure>
        </div>
      </section>
      <section class="section">
        <h3 class="section-title">图片</h3>
        <div class="grid">
          <figure class="card" onclick="app.openViewer(0)"><div class="cover skeleton"></div><figcaption><span class="name">IMG_0001.jpg</span><span class="count">尚未加载</span></figcaption></figure>
          <figure class="card" onclick="app.openViewer(1)"><div class="cover placeholder">IMG_0002</div><figcaption><span class="name">IMG_0002.jpg</span><span class="count">4.2 MB</span></figcaption></figure>
          <figure class="card" onclick="app.openViewer(2)"><div class="cover placeholder">IMG_0003</div><figcaption><span class="name">IMG_0003.jpg</span><span class="count">3.8 MB</span></figcaption></figure>
          <figure class="card" onclick="app.openViewer(3)"><div class="cover placeholder">IMG_0004</div><figcaption><span class="name">IMG_0004.jpg</span><span class="count">5.1 MB</span></figcaption></figure>
          <figure class="card" onclick="app.openViewer(4)"><div class="cover placeholder">IMG_0005</div><figcaption><span class="name">IMG_0005.jpg</span><span class="count">2.9 MB</span></figcaption></figure>
          <figure class="card" onclick="app.openViewer(5)"><div class="cover placeholder">IMG_0006</div><figcaption><span class="name">IMG_0006.jpg</span><span class="count">6.0 MB</span></figcaption></figure>
        </div>
      </section>
      <section class="section">
        <h3 class="section-title">空态示例</h3>
        <div class="empty"><div class="icon">◻</div><div class="hint">该目录暂无图片</div><button class="btn primary">导入图片</button></div>
      </section>
    </div>
  </main>
</div>

<!-- Viewer -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-top">
    <button id="closeViewer">✕</button>
    <div class="nav"><button id="prevBtn">‹</button><span class="counter" id="counter">2 / 6</span><button id="nextBtn">›</button></div>
    <button>适应</button>
    <button>100%</button>
    <button>↻</button>
  </div>
  <div class="img-wrap"><div class="stage-placeholder" id="stageText">原图预览占位</div></div>
  <div class="filmstrip" id="filmstrip"></div>
  <div class="info" id="info">IMG_0002.jpg · 4096×2731 · 100%</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal" style="display:none">
  <div class="modal">
    <div class="modal-header"><h3>确认删除</h3><button class="btn icon" id="closeModal">✕</button></div>
    <div class="modal-body">确定要删除“东京 2024”及其全部子目录吗？此操作不可撤销。</div>
    <div class="modal-actions"><button class="btn" id="cancelModal">取消</button><button class="btn danger" id="confirmModal">删除</button></div>
  </div>
</div>

<div class="demo-note">样式 Demo · 仅展示视觉，非运行中的应用</div>

<script>
var app = {
  items: ["IMG_0001.jpg","IMG_0002.jpg","IMG_0003.jpg","IMG_0004.jpg","IMG_0005.jpg","IMG_0006.jpg"],
  index: 0,
  applyTheme: function(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    var t = document.getElementById("themeToggle");
    if (t) t.textContent = theme === "dark" ? "☾" : "☀";
    localStorage.setItem("kanitsu-theme", theme);
  },
  toggleTheme: function() {
    var cur = document.documentElement.getAttribute("data-theme") || "dark";
    this.applyTheme(cur === "dark" ? "light" : "dark");
  },
  initTheme: function() {
    var saved = localStorage.getItem("kanitsu-theme");
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    this.applyTheme(theme);
  },
  buildStrip: function() {
    var strip = document.getElementById("filmstrip");
    strip.innerHTML = "";
    for (var i = 0; i < this.items.length; i++) {
      var d = document.createElement("div");
      d.className = "thumb" + (i === this.index ? " active" : "");
      d.textContent = (i+1);
      (function(self, idx, el){ el.onclick = function(){ self.index = idx; self.render(); }; })(this, i, d);
      strip.appendChild(d);
    }
  },
  render: function() {
    var lb = document.getElementById("lightbox");
    var counter = document.getElementById("counter");
    var info = document.getElementById("info");
    var stage = document.getElementById("stageText");
    counter.textContent = (this.index+1) + " / " + this.items.length;
    info.textContent = this.items[this.index] + " · 4096×2731 · 100%";
    stage.textContent = "原图预览占位 · " + this.items[this.index];
    this.buildStrip();
  },
  openViewer: function(idx) {
    this.index = idx;
    this.render();
    document.getElementById("lightbox").classList.add("open");
    document.body.style.overflow = "hidden";
  },
  closeViewer: function() {
    document.getElementById("lightbox").classList.remove("open");
    document.body.style.overflow = "";
  },
  showToast: function(msg, kind) {
    var toast = document.getElementById("toast");
    var item = document.createElement("div");
    item.className = "item" + (kind ? " " + kind : "");
    item.textContent = msg;
    toast.appendChild(item);
    setTimeout(function(){ item.remove(); }, 3200);
  }
};

document.getElementById("themeToggle").onclick = function(){ app.toggleTheme(); };
document.getElementById("slideToggle").onclick = function(){ document.getElementById("appShell").classList.toggle("sidebar-collapsed"); };
document.getElementById("closeViewer").onclick = function(){ app.closeViewer(); };
document.getElementById("prevBtn").onclick = function(){ app.index = Math.max(0, app.index - 1); app.render(); };
document.getElementById("nextBtn").onclick = function(){ app.index = Math.min(app.items.length - 1, app.index + 1); app.render(); };
document.getElementById("closeModal").onclick = function(){ document.getElementById("modal").style.display = "none"; };
document.getElementById("cancelModal").onclick = function(){ document.getElementById("modal").style.display = "none"; app.showToast("已取消", "info"); };
document.getElementById("confirmModal").onclick = function(){ document.getElementById("modal").style.display = "none"; app.showToast("删除成功", "success"); };

app.initTheme();
app.render();

// 单击图片网格里的卡片即可体验查看器；这里演示点击删除按钮弹出确认框：
var del = document.querySelector(".header-actions .btn.danger");
if (del) del.onclick = function(){ document.getElementById("modal").style.display = "flex"; };

document.addEventListener("keydown", function(e){
  if (!document.getElementById("lightbox").classList.contains("open")) return;
  if (e.key === "Escape") app.closeViewer();
  if (e.key === "ArrowLeft") { app.index = Math.max(0, app.index - 1); app.render(); }
  if (e.key === "ArrowRight") { app.index = Math.min(app.items.length - 1, app.index + 1); app.render(); }
});
</script>
</body>
</html>

name: Windows Portable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 Portable
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    env:
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
      KANITSU_SIGN_AND_EDIT_EXECUTABLE: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --strict-allow-scripts

      - name: Read desktop version
        id: metadata
        shell: pwsh
        run: |
          $package = Get-Content -Raw 'apps/desktop/package.json' | ConvertFrom-Json
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Type-check workspaces
        run: npm run typecheck

      - name: Run workspace tests
        run: npm test --workspaces --if-present

      - name: Build and verify Portable executable
        run: npm run build:portable

      - name: Re-verify published artifact
        run: npm run verify:portable

      - name: Upload Portable executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kanitsu-Portable-${{ steps.metadata.outputs.version }}-x64
          path: |
            apps/desktop/release/portable/Kanitsu-Portable-${{ steps.metadata.outputs.version }}-x64.exe
            apps/desktop/release/portable/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # 构建通过后为 tag 生成 draft Release，附件与 Actions Artifact 是同一批文件。
  # 只创建 draft：产物尚未代码签名，验收通过后由发布者补齐说明并手动发布。
  release:
    name: Create Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download Portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Kanitsu-Portable-${{ needs.build.outputs.version }}-x64
          path: release-assets

      - name: Create draft Release with EXE and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_NOTES: |
            本页附件由 CI 构建，并通过文件名、体积、PE 结构与 SHA-256 校验；产物尚未做代码签名，
            Windows SmartScreen 可能提示风险。
            发布前请按 docs/Windows-Portable-打包与发布指南.md 第 9 节完成验收。
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "已存在 $TAG 的 Release，跳过创建；如需重做，请先删除该 draft。"
            exit 0
          fi
          gh release create "$TAG" \
            "release-assets/Kanitsu-Portable-${VERSION}-x64.exe" \
            "release-assets/SHA256SUMS.txt" \
            --title "Kanitsu $TAG" \
            --notes "$RELEASE_NOTES" \
            --generate-notes \
            --draft \
            --verify-tag

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">Kanitsu application icon</title>
  <desc id="desc">Three layered rounded image cards with a small coral accent tab on a transparent canvas.</desc>

  <defs>
    <linearGradient id="back-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2E9D8" />
      <stop offset="1" stop-color="#E6DCC8" />
    </linearGradient>
    <linearGradient id="middle-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7182B5" />
      <stop offset="1" stop-color="#5C6C9B" />
    </linearGradient>
    <linearGradient id="front-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9ED" />
      <stop offset="1" stop-color="#F0E8D9" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F47461" />
      <stop offset="1" stop-color="#E85B4D" />
    </linearGradient>
    <filter id="card-shadow" x="-24%" y="-20%" width="148%" height="156%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#05060A" flood-opacity="0.26" />
    </filter>
  </defs>

  <g id="kanitsu-mark" shape-rendering="geometricPrecision">
    <rect x="225" y="430" width="634" height="638" rx="42" fill="url(#back-card)" filter="url(#card-shadow)" />
    <rect x="330" y="295" width="590" height="700" rx="46" fill="url(#middle-card)" filter="url(#card-shadow)" />
    <rect x="480" y="205" width="510" height="720" rx="40" fill="url(#front-card)" filter="url(#card-shadow)" />
    <path
      d="M990 533L954 553C943 559 937 568 937 580V631C937 643 943 652 954 658L990 678Z"
      fill="url(#accent)"
    />
  </g>
</svg>
